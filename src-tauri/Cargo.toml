[package]
name = "deepseek-harness"
version = "0.1.0"
description = "DeepSeek Harness Linux 原生桌面客户端（Tauri 2 / WebKitGTK）"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "image-ico", "tray-icon"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
ureq = { version = "2", features = ["gzip"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
